      REDIS_CLUSTER_PORT: 7002
      REDIS_CLUSTER_BUS_PORT: 17002
      REDIS_CLUSTER_ANNOUNCE_HOSTNAME: redis-cluster-7002
      REDIS_CLUSTER_ANNOUNCE_IP: "172.30.0.12"
    networks:
