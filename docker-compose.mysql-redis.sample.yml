version: "3"

services:
  mysql-primary:
    image: mysql:${MYSQL_REPLICATION_VERSION}
    container_name: mysql-primary
    ports:
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${MYSQL_PRIMARY_HOST_PORT}:3306"
    volumes:
      - ${MYSQL_PRIMARY_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql-primary:/var/lib/mysql/:rw
      - ${MYSQL_PRIMARY_LOG_DIR}:/var/log/mysql/:rw
      - ./services/mysql-replication/init/primary:/docker-entrypoint-initdb.d:ro
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PRIMARY_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "${MYSQL_PRIMARY_ROOT_HOST}"
      MYSQL_REPLICATION_USER: "${MYSQL_REPLICATION_USER}"
      MYSQL_REPLICATION_PASSWORD: "${MYSQL_REPLICATION_PASSWORD}"
      MYSQL_DEBEZIUM_USER: "${MYSQL_DEBEZIUM_USER:-}"
      MYSQL_DEBEZIUM_PASSWORD: "${MYSQL_DEBEZIUM_PASSWORD:-}"
      TZ: "$TZ"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default

  mysql-replica:
    image: mysql:${MYSQL_REPLICATION_VERSION}
    container_name: mysql-replica
    depends_on:
      - mysql-primary
    ports:
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${MYSQL_REPLICA_HOST_PORT}:3306"
    volumes:
      - ${MYSQL_REPLICA_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql-replica:/var/lib/mysql/:rw
      - ${MYSQL_REPLICA_LOG_DIR}:/var/log/mysql/:rw
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_REPLICA_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "${MYSQL_REPLICA_ROOT_HOST}"
      TZ: "$TZ"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default

  mysql-replication-init:
    image: mysql:${MYSQL_REPLICATION_VERSION}
    container_name: mysql-replication-init
    depends_on:
      - mysql-primary
      - mysql-replica
    volumes:
      - ./services/mysql-replication/init/replica/setup-replication.sh:/usr/local/bin/setup-replication.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-replication.sh"]
    restart: "no"
    environment:
      MYSQL_PRIMARY_HOST: mysql-primary
      MYSQL_PRIMARY_PORT: 3306
      MYSQL_PRIMARY_ROOT_PASSWORD: "${MYSQL_PRIMARY_ROOT_PASSWORD}"
      MYSQL_REPLICA_HOST: mysql-replica
      MYSQL_REPLICA_PORT: 3306
      MYSQL_REPLICA_ROOT_PASSWORD: "${MYSQL_REPLICA_ROOT_PASSWORD}"
      MYSQL_REPLICATION_USER: "${MYSQL_REPLICATION_USER}"
      MYSQL_REPLICATION_PASSWORD: "${MYSQL_REPLICATION_PASSWORD}"
      MYSQL_DEBEZIUM_USER: "${MYSQL_DEBEZIUM_USER:-}"
      MYSQL_DEBEZIUM_PASSWORD: "${MYSQL_DEBEZIUM_PASSWORD:-}"
      TZ: "$TZ"
    networks:
      - default

  redis-cluster-7001:
    image: redis:${REDIS_CLUSTER_VERSION}
    container_name: redis-cluster-7001
    ports:
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${REDIS_CLUSTER_NODE_1_PORT}:7001"
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${REDIS_CLUSTER_NODE_1_BUS_PORT}:17001"
    volumes:
      - ${REDIS_CLUSTER_BASE_CONF_FILE}:/usr/local/etc/redis/redis-cluster-base.conf:ro
      - ./services/redis/cluster/start-node.sh:/usr/local/bin/start-node.sh:ro
      - ${DATA_DIR}/redis-cluster/7001:/data:rw
    restart: always
    entrypoint: ["/bin/sh", "/usr/local/bin/start-node.sh"]
    environment:
      TZ: "$TZ"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_CLUSTER_PORT: 7001
      REDIS_CLUSTER_BUS_PORT: 17001
      REDIS_CLUSTER_ANNOUNCE_HOSTNAME: redis-cluster-7001
      REDIS_CLUSTER_ANNOUNCE_IP: "172.30.0.11"
    networks:
      default: {}
      redis-cluster:
        ipv4_address: "172.30.0.11"

  redis-cluster-7002:
    image: redis:${REDIS_CLUSTER_VERSION}
    container_name: redis-cluster-7002
