version: "3"

services:
  mysql-primary:
    image: mysql:${MYSQL_REPLICATION_VERSION}
    container_name: mysql-primary
    ports:
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${MYSQL_PRIMARY_HOST_PORT}:3306"
    volumes:
      - ${MYSQL_PRIMARY_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql-primary:/var/lib/mysql/:rw
      - ${MYSQL_PRIMARY_LOG_DIR}:/var/log/mysql/:rw
      - ./services/mysql-replication/healthcheck.sh:/usr/local/bin/mysql-healthcheck.sh:ro
    restart: always
    stop_grace_period: 1m
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PRIMARY_ROOT_PASSWORD:?MYSQL_PRIMARY_ROOT_PASSWORD must be set}"
      MYSQL_ROOT_HOST: "${MYSQL_PRIMARY_ROOT_HOST}"
      MYSQL_CONFIG_DIGEST: "${MYSQL_PRIMARY_CONFIG_DIGEST:-manual}"
      MYSQL_HEALTH_ROLE: primary
      TZ: "$TZ"
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/mysql-healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - default

  mysql-replica:
    image: mysql:${MYSQL_REPLICATION_VERSION}
    container_name: mysql-replica
    depends_on:
      mysql-primary:
        condition: service_healthy
    ports:
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${MYSQL_REPLICA_HOST_PORT}:3306"
    volumes:
      - ${MYSQL_REPLICA_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql-replica:/var/lib/mysql/:rw
      - ${MYSQL_REPLICA_LOG_DIR}:/var/log/mysql/:rw
      - ./services/mysql-replication/init/replica:/docker-entrypoint-initdb.d:ro
      - ./services/mysql-replication/healthcheck.sh:/usr/local/bin/mysql-healthcheck.sh:ro
    restart: always
    stop_grace_period: 1m
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_REPLICA_ROOT_PASSWORD:?MYSQL_REPLICA_ROOT_PASSWORD must be set}"
      MYSQL_ROOT_HOST: "${MYSQL_REPLICA_ROOT_HOST}"
      MYSQL_CONFIG_DIGEST: "${MYSQL_REPLICA_CONFIG_DIGEST:-manual}"
      MYSQL_PRIMARY_HOST: mysql-primary
      MYSQL_PRIMARY_PORT: 3306
      MYSQL_REPLICATION_USER: "${MYSQL_REPLICATION_USER:?MYSQL_REPLICATION_USER must be set}"
      MYSQL_REPLICATION_MAX_LAG_SECONDS: "${MYSQL_REPLICATION_MAX_LAG_SECONDS}"
      MYSQL_HEALTH_ROLE: replica
      TZ: "$TZ"
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/mysql-healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - default

  mysql-replication-init:
    image: mysql:${MYSQL_REPLICATION_VERSION}
    container_name: mysql-replication-init
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_started
    volumes:
      - ./services/mysql-replication/setup-replication.sh:/usr/local/bin/setup-replication.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-replication.sh"]
    restart: "no"
    environment:
      MYSQL_PRIMARY_HOST: mysql-primary
      MYSQL_PRIMARY_PORT: 3306
      MYSQL_PRIMARY_ROOT_PASSWORD: "${MYSQL_PRIMARY_ROOT_PASSWORD:?MYSQL_PRIMARY_ROOT_PASSWORD must be set}"
      MYSQL_REPLICA_HOST: mysql-replica
      MYSQL_REPLICA_PORT: 3306
      MYSQL_REPLICA_ROOT_PASSWORD: "${MYSQL_REPLICA_ROOT_PASSWORD:?MYSQL_REPLICA_ROOT_PASSWORD must be set}"
      MYSQL_REPLICATION_USER: "${MYSQL_REPLICATION_USER:?MYSQL_REPLICATION_USER must be set}"
      MYSQL_REPLICATION_PASSWORD: "${MYSQL_REPLICATION_PASSWORD:?MYSQL_REPLICATION_PASSWORD must be set}"
      MYSQL_REPLICATION_WAIT_SECONDS: "${MYSQL_REPLICATION_WAIT_SECONDS}"
      MYSQL_REPLICATION_MAX_LAG_SECONDS: "${MYSQL_REPLICATION_MAX_LAG_SECONDS}"
      MYSQL_DEBEZIUM_USER: "${MYSQL_DEBEZIUM_USER:-}"
      MYSQL_DEBEZIUM_PASSWORD: "${MYSQL_DEBEZIUM_PASSWORD:-}"
      TZ: "$TZ"
    networks:
      - default

  redis-cluster-7001:
    image: redis:${REDIS_CLUSTER_VERSION}
    container_name: redis-cluster-7001
    ports:
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${REDIS_CLUSTER_NODE_1_HOST_PORT}:7001"
    volumes:
      - ./services/redis/redis-cluster.conf:/usr/local/etc/redis/redis-cluster-base.conf:ro
      - ./services/redis/cluster/start-node.sh:/usr/local/bin/start-node.sh:ro
      - ./services/redis/cluster/init-cluster.sh:/usr/local/bin/init-cluster.sh:ro
      - ${DATA_DIR}/redis-cluster/7001:/data:rw
    restart: always
    stop_grace_period: 30s
    entrypoint: ["/bin/sh", "/usr/local/bin/start-node.sh"]
    environment:
      TZ: "$TZ"
      REDIS_CLUSTER_PASSWORD: "${REDIS_CLUSTER_PASSWORD:?REDIS_CLUSTER_PASSWORD must be set}"
      REDIS_CLUSTER_CONFIG_DIGEST: "${REDIS_CLUSTER_CONFIG_DIGEST:-manual}"
      REDIS_CLUSTER_PORT: 7001
      REDIS_CLUSTER_BUS_PORT: 17001
      REDIS_CLUSTER_ANNOUNCE_HOSTNAME: redis-cluster-7001
      REDIS_CLUSTER_ANNOUNCE_IP: "172.30.0.11"
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/init-cluster.sh", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default: {}
      redis-cluster:
        ipv4_address: "172.30.0.11"

