version: "3"

services:
  mysql-master:
    image: mysql:${MYSQL_VERSION}
    container_name: mysql-master
    ports:
      - "${MYSQL_MASTER_HOST_PORT}:3306"
    volumes:
      - ${MYSQL_MASTER_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql-master:/var/lib/mysql/:rw
      - ${MYSQL_MASTER_LOG_DIR}:/var/log/mysql/:rw
      - ./services/mysql-replication/init/master:/docker-entrypoint-initdb.d:ro
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_MASTER_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "${MYSQL_MASTER_ROOT_HOST}"
      MYSQL_REPLICATION_USER: "${MYSQL_REPLICATION_USER}"
      MYSQL_REPLICATION_PASSWORD: "${MYSQL_REPLICATION_PASSWORD}"
      TZ: "$TZ"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default

  mysql-slave:
    image: mysql:${MYSQL_VERSION}
    container_name: mysql-slave
    depends_on:
      - mysql-master
    ports:
      - "${MYSQL_SLAVE_HOST_PORT}:3306"
    volumes:
      - ${MYSQL_SLAVE_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql-slave:/var/lib/mysql/:rw
      - ${MYSQL_SLAVE_LOG_DIR}:/var/log/mysql/:rw
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_SLAVE_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "${MYSQL_SLAVE_ROOT_HOST}"
      TZ: "$TZ"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default

  mysql-replica-init:
    image: mysql:${MYSQL_VERSION}
    container_name: mysql-replica-init
    depends_on:
      - mysql-master
      - mysql-slave
    volumes:
      - ./services/mysql-replication/init/replica/setup-replica.sh:/usr/local/bin/setup-replica.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-replica.sh"]
    restart: "no"
    environment:
      MYSQL_MASTER_HOST: mysql-master
      MYSQL_MASTER_PORT: 3306
      MYSQL_MASTER_ROOT_PASSWORD: "${MYSQL_MASTER_ROOT_PASSWORD}"
      MYSQL_SLAVE_HOST: mysql-slave
      MYSQL_SLAVE_PORT: 3306
      MYSQL_SLAVE_ROOT_PASSWORD: "${MYSQL_SLAVE_ROOT_PASSWORD}"
      MYSQL_REPLICATION_USER: "${MYSQL_REPLICATION_USER}"
      MYSQL_REPLICATION_PASSWORD: "${MYSQL_REPLICATION_PASSWORD}"
      TZ: "$TZ"
    networks:
      - default

  redis-cluster-7001:
    image: redis:${REDIS_VERSION}
    container_name: redis-cluster-7001
    ports:
      - "${REDIS_CLUSTER_NODE_1_PORT}:7001"
      - "${REDIS_CLUSTER_NODE_1_BUS_PORT}:17001"
    volumes:
      - ${REDIS_CLUSTER_BASE_CONF_FILE}:/usr/local/etc/redis/redis-cluster-base.conf:ro
      - ./services/redis/cluster/start-node.sh:/usr/local/bin/start-node.sh:ro
      - ${DATA_DIR}/redis-cluster/7001:/data:rw
    restart: always
    entrypoint: ["/bin/sh", "/usr/local/bin/start-node.sh"]
    environment:
      TZ: "$TZ"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_CLUSTER_PORT: 7001
      REDIS_CLUSTER_BUS_PORT: 17001
      REDIS_CLUSTER_ANNOUNCE_HOSTNAME: redis-cluster-7001
      REDIS_CLUSTER_ANNOUNCE_IP: "${REDIS_CLUSTER_NODE_1_IP:-172.30.0.11}"
    networks:
      default: {}
      redis-cluster:
        ipv4_address: "${REDIS_CLUSTER_NODE_1_IP:-172.30.0.11}"

  redis-cluster-7002:
    image: redis:${REDIS_VERSION}
    container_name: redis-cluster-7002
