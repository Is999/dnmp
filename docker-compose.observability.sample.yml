version: "3"

services:
  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION}
    container_name: jaeger
    ports:
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${JAEGER_OTLP_GRPC_HOST_PORT}:4317"
      - "${DNMP_EXT_HOST_IP:-127.0.0.1}:${JAEGER_OTLP_HTTP_HOST_PORT}:4318"
      - "${DNMP_ADMIN_HOST_IP:-127.0.0.1}:${JAEGER_UI_HOST_PORT}:16686"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: "$TZ"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:13133/status | grep -q '\"healthy\":true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - default
